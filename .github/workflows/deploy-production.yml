name: Deploy Production to VPS

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  deploy-production:
    name: Zero-Downtime Production Deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Production Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Execute Zero-Downtime Deployment & Health Verification
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /opt/optix
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh ghcr.io/${{ github.repository }}/backend:latest
