# Nginx Reverse Proxy Config for Optix VPS Public IP (200.141.7.8)
upstream optix_backend_staging {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 200.141.7.8 _;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate Limiting (Using zone defined in /etc/nginx/conf.d/rate_limit.conf)
    limit_req zone=ip_limit burst=50 nodelay;

    client_max_body_size 15M;

    location / {
        proxy_pass http://optix_backend_staging;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Health Check Endpoint Pass-Through
    location /health {
        proxy_pass http://optix_backend_staging/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
