# Initial HTTP Bootstrap Nginx Configuration for api.optixapp.in (Before SSL Certificate Creation)
upstream optix_backend_cluster {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.optixapp.in optixapp.in _;

    # Let's Encrypt Certbot Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate Limiting
    limit_req zone=ip_limit burst=50 nodelay;

    client_max_body_size 15M;

    location / {
        proxy_pass http://optix_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /health {
        proxy_pass http://optix_backend_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
