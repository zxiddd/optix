# Nginx Reverse Proxy Config for Optix Production Domain (api.optixpos.com)
upstream optix_backend_production {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name api.optixpos.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.optixpos.com;

    ssl_certificate /etc/letsencrypt/live/api.optixpos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.optixpos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=prod_api_limit:10m rate=50r/s;
    limit_req zone=prod_api_limit burst=100 nodelay;

    client_max_body_size 15M;

    location / {
        proxy_pass http://optix_backend_production;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /health {
        proxy_pass http://optix_backend_production/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
