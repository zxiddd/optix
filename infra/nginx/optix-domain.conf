# Nginx Reverse Proxy & SSL Configuration for Optix Domain (api.optixapp.in)
upstream optix_backend_cluster {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# HTTP Server Block - Force 301 Redirect to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.optixapp.in optixapp.in _;

    # Let's Encrypt Certbot Challenge Validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://api.optixapp.in$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.optixapp.in;

    # SSL Certificates (Managed by Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/api.optixapp.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.optixapp.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Rate Limiting (Using zone defined in /etc/nginx/conf.d/rate_limit.conf)
    limit_req zone=ip_limit burst=50 nodelay;

    client_max_body_size 15M;

    location / {
        proxy_pass http://optix_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://optix_backend_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
